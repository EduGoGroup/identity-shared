name: Release CI/CD

# Repo multi-módulo: los releases son SIEMPRE por módulo, con tags <modulo>/vX.Y.Z
# (p. ej. auth/v0.1.0). No hay go.mod en la raíz, así que no hay tag raíz.
on:
  push:
    tags:
      - '*/v*'

env:
  GO_VERSION: '1.25'
  GOPRIVATE: github.com/EduGoGroup/*

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      module: ${{ steps.meta.outputs.module }}
      title: ${{ steps.meta.outputs.title }}
      changelog_file: ${{ steps.meta.outputs.changelog_file }}
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver metadata de release
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG##*/}"
          MODULE="${TAG%/$VERSION}"

          if [ ! -f "$MODULE/go.mod" ]; then
            echo "::error::El tag '$TAG' no corresponde a un modulo existente ($MODULE/go.mod no existe)"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "module=$MODULE" >> "$GITHUB_OUTPUT"
          echo "title=Release $MODULE $VERSION" >> "$GITHUB_OUTPUT"
          echo "changelog_file=$MODULE/CHANGELOG.md" >> "$GITHUB_OUTPUT"

  validate-module:
    name: Validate ${{ needs.prepare-release.outputs.module }}
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ needs.prepare-release.outputs.module }}/go.mod

      - name: Configurar credencial para dependencias privadas
        run: |
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Descargar dependencias
        working-directory: ${{ needs.prepare-release.outputs.module }}
        run: go mod download

      - name: Verificar formato
        working-directory: ${{ needs.prepare-release.outputs.module }}
        run: |
          if ! gofmt -l . | grep -q .; then
            echo "Codigo formateado correctamente"
          else
            echo "Codigo no esta formateado:"
            gofmt -l .
            exit 1
          fi

      - name: Analisis estatico (go vet)
        working-directory: ${{ needs.prepare-release.outputs.module }}
        run: go vet ./...

      - name: Ejecutar tests
        working-directory: ${{ needs.prepare-release.outputs.module }}
        run: go test -short -v -race ./...

      - name: Tests con cobertura
        working-directory: ${{ needs.prepare-release.outputs.module }}
        run: |
          mkdir -p coverage
          go test -short -v -race -coverprofile=coverage/coverage.out -covermode=atomic ./...
          if [ -f coverage/coverage.out ]; then
            go tool cover -func=coverage/coverage.out | tail -1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0
          working-directory: ${{ needs.prepare-release.outputs.module }}
          args: --timeout=5m

      - name: Verificar build
        working-directory: ${{ needs.prepare-release.outputs.module }}
        run: go build -v ./...

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, validate-module]
    permissions:
      contents: write

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraer changelog para esta version
        env:
          CHANGELOG_FILE: ${{ needs.prepare-release.outputs.changelog_file }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          MODULE: ${{ needs.prepare-release.outputs.module }}
        run: |
          # Extrae la seccion "## [X.Y.Z]" del CHANGELOG del modulo, hasta la
          # siguiente cabecera de version.
          BARE="${VERSION#v}"
          if [ -f "$CHANGELOG_FILE" ]; then
            awk -v v="$BARE" '
              $0 ~ "^## \\[" v "\\]" { found = 1; next }
              found && /^## \[/       { exit }
              found                   { print }
            ' "$CHANGELOG_FILE" > /tmp/changelog.md
          fi

          if [ ! -s /tmp/changelog.md ]; then
            echo "No se encontro la seccion [$BARE] en $CHANGELOG_FILE; se usan notas por defecto"
            printf '## [%s]\n\nRelease del modulo %s.\n' "$BARE" "$MODULE" > /tmp/changelog.md
          else
            echo "Notas de release extraidas desde $CHANGELOG_FILE"
          fi

      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          TITLE: ${{ needs.prepare-release.outputs.title }}
          MODULE: ${{ needs.prepare-release.outputs.module }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          NOTES_FILE=/tmp/changelog.md

          # Nota: se usan echo en lugar de heredoc para evitar el conflicto
          # entre la indentación YAML y los delimitadores de heredoc bash.
          {
            echo ""
            echo "---"
            echo ""
            echo "## Instalacion del modulo"
            echo ""
            echo '```bash'
            echo "go get github.com/EduGoGroup/identity-shared/$MODULE@$VERSION"
            echo '```'
            echo ""
            echo "## Documentacion relacionada"
            echo ""
            echo "- https://github.com/$REPO/blob/$TAG/$MODULE/README.md"
            echo "- https://github.com/$REPO/blob/$TAG/$MODULE/CHANGELOG.md"
          } >> "$NOTES_FILE"

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            --verify-tag
